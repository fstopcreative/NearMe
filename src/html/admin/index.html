<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin · Corelain Near Me</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    /* theme before first paint, so the panel never flashes the wrong one */
    (function () {
      var t; try { t = localStorage.getItem('cr-adm:theme'); } catch (e) {}
      /* Dark by default, as on the site itself; 'system' only once it is chosen here. */
      if (!t) { t = 'dark'; }
      if (t === 'system') { try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'dark'; } }
      document.documentElement.setAttribute('data-ax-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" />
  <link rel="stylesheet" href="/src/styles/app.css" />
</head>
<body class="adm">
  <!-- Admin panel for Corelain Near Me. No database: content lives in JSON files in
       the repository; saves go through /api/admin (api/admin.js), which commits them. -->

  <!-- ── Sign in ── -->
  <main class="adm-login" data-adm-login hidden>
    <form class="adm-login__card" data-adm-login-form>
      <img class="adm-login__logo adm-logo--light" src="/images/logo-light.png" alt="Corelain" width="579" height="108" />
      <img class="adm-login__logo adm-logo--dark" src="/images/logo-dark.png" alt="Corelain" width="579" height="108" />
      <h1 class="adm-login__title">Near Me admin</h1>
      <label class="adm-field"><span>Username</span><input class="adm-input" name="username" autocomplete="username" required /></label>
      <label class="adm-field"><span>Password</span><input class="adm-input" name="password" type="password" autocomplete="current-password" required autofocus /></label>
      <p class="adm-error" data-adm-login-error hidden></p>
      <button type="submit" class="adm-btn adm-btn--primary adm-btn--block">Sign in</button>
    </form>
  </main>

  <!-- ── Panel ── -->
  <div class="adm-shell" data-adm-app hidden>
    <div class="adm-backdrop" data-adm-backdrop hidden></div>
    <aside class="adm-side">
      <button type="button" class="adm-burger" data-adm-burger aria-label="Open menu" aria-expanded="false" aria-controls="adm-nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="adm-side__brand" href="/" title="Open the site">
        <img class="adm-logo--light adm-logo--full" src="/images/logo-light.png" alt="Corelain" width="579" height="108" />
        <img class="adm-logo--dark adm-logo--full" src="/images/logo-dark.png" alt="Corelain" width="579" height="108" />
        <img class="adm-logo--light adm-logo--mark" src="/images/logo-mark-light.png" alt="Corelain" width="502" height="390" />
        <img class="adm-logo--dark adm-logo--mark" src="/images/logo-mark-dark.png" alt="Corelain" width="502" height="390" />
      </a>
      <nav class="adm-nav" id="adm-nav" role="tablist" aria-label="Admin sections" data-adm-nav></nav>
      <div class="adm-side__foot">
        <button type="button" class="adm-ghost" data-adm-theme title="Switch light / dark">
          <svg class="adm-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="adm-ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9a9 9 0 1 1-9-9z"/></svg>
          <span data-adm-theme-label>Dark</span>
        </button>
        <div class="adm-side__user">
          <span class="adm-avatar" data-adm-initial>A</span>
          <span class="adm-side__meta"><b data-adm-user>admin</b><small data-adm-repo></small></span>
          <button type="button" class="adm-icon" data-adm-logout title="Sign out" aria-label="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-2"/><path d="M9 12h12M18 9l3 3l-3 3"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <main class="adm-main">
      <header class="adm-head">
        <div>
          <h1 class="adm-head__title" data-adm-title>Data freshness</h1>
          <p class="adm-head__sub" data-adm-sub></p>
        </div>
        <a class="adm-ghost adm-head__view" href="/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6h-6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M11 13l9-9"/><path d="M15 4h5v5"/></svg>
          View site
        </a>
      </header>
      <p class="adm-banner adm-banner--warn" data-adm-storage hidden></p>
      <section class="adm-panel" data-panel="overview"></section>
      <section class="adm-panel" data-panel="site-content" hidden></section>
      <section class="adm-panel" data-panel="rail-lines" hidden></section>
      <section class="adm-panel" data-panel="reviews" hidden></section>
      <section class="adm-panel" data-panel="manual" hidden></section>
    </main>
  </div>

  <div class="adm-toast" data-adm-toast role="status" aria-live="polite" hidden></div>
  <script type="module" src="/src/js/pages/admin.js"></script>
</body>
</html>
