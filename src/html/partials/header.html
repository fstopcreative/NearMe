<header class="ax-header" role="banner" x-data="axHeader()">
  <!-- 1 · SIDEBAR TOGGLE -->
  <button type="button" class="ax-nav-toggle ax-icon-btn" @click="toggleSidebar()" aria-label="Toggle menu" :aria-expanded="!collapsed">
    <svg class="ax-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="24" height="24" aria-hidden="true"><path d="M4 6l16 0" /><path d="M4 12l16 0" /><path d="M4 18l16 0" /></svg>
  </button>

  <!-- 1b · BRAND — only shown on top-bar-only pages (html[data-cr-shell="topbar"]) -->
  <a class="cr-header-brand" href="/" aria-label="Corelain Dashboard home">
    <img class="cr-header-brand__logo cr-header-brand__logo--light" src="/images/logo-light.png" alt="Corelain" width="579" height="108">
    <img class="cr-header-brand__logo cr-header-brand__logo--dark" src="/images/logo-dark.png" alt="Corelain" width="579" height="108">
    <img class="cr-header-brand__mark cr-header-brand__logo--light" src="/images/logo-mark-light.png" alt="Corelain" width="502" height="390">
    <img class="cr-header-brand__mark cr-header-brand__logo--dark" src="/images/logo-mark-dark.png" alt="Corelain" width="502" height="390">
  </a>

  <!-- 2 · COMMAND SEARCH (⌘K trigger) -->
  <button type="button" class="ax-search" @click="$dispatch('ax-command-open')" aria-haspopup="dialog" aria-controls="ax-command" aria-label="Search area or postcode">
    <svg class="ax-icon ax-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="24" height="24" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
    <span class="ax-search__placeholder">Search area or postcode…</span>
    <kbd class="ax-search__keycap">⌘K</kbd>
  </button>

  <span class="ax-header__spacer"></span>

  <!-- ===== RIGHT UTILITY CLUSTER =====
       Shared with the full-screen app bar (partials/app-bar.html) so the two
       chromes can never drift. Items 4–11 + the responsive overflow shed. -->
  {{> header-utils}}
</header>
